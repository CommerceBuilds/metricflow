name: Required Tests
on:
  # FORK: CommerceBuilds/metricflow runs upstream's suite and its own span tests on every push to `analyticsbuilds-main`.
  push:
    branches:
      - "analyticsbuilds-main"
  workflow_dispatch:
    inputs:
      overwrite_snapshots:
        # FORK: switches on the `overwrite-snapshots` job (see that job).
        description: "Regenerate the DuckDB and PostgreSQL snapshots and commit the changed ones to this branch"
        type: boolean
        default: false
  pull_request:
    # run these jobs when a PR is opened, reopened, or updated (synchronize)
    # synchronize = commit(s) pushed to the pull request
    types:
      - opened
      - reopened
      - synchronize
jobs:

  # FORK: regenerates upstream's snapshots that the fork's engine changes move, on the branch the workflow is
  # dispatched on, and commits the changed snapshot files back to it. It runs the targets the two test jobs below
  # run (`test-include-slow-metricflow` for DuckDB, which is `make test` plus the slow tests, and `test-postgres`),
  # each with `--overwrite-snapshots`, then commits whatever snapshot files changed.
  #
  # `contents: write`: the job pushes with the workflow's `GITHUB_TOKEN`, which is a GitHub App installation access
  # token, and HTTP-based Git access with one needs the app's "Contents" repository permission; `write` includes
  # `read`, and every permission not named here is `none`. (docs.github.com, read 2026-11-21:
  # actions/concepts/security/github_token; apps/creating-github-apps/authenticating-with-a-github-app/
  # authenticating-as-a-github-app-installation; actions/reference/workflows-and-actions/workflow-syntax#permissions.)
  # A push made with the `GITHUB_TOKEN` starts no new workflow run (the same github_token page), so a pull request's
  # checks are re-run by hand after this job commits.
  overwrite-snapshots:
    name: Overwrite Snapshots
    if: github.event_name == 'workflow_dispatch' && inputs.overwrite_snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: metricflow
          POSTGRES_PASSWORD: metricflowing
          POSTGRES_DB: metricflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check-out the branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Overwrite the DuckDB snapshots
        id: duckdb
        continue-on-error: true
        uses: ./.github/actions/run-mf-tests
        with:
          make-target: "test-include-slow-metricflow"
          additional-pytest-options: "--overwrite-snapshots"

      - name: Overwrite the PostgreSQL snapshots
        id: postgres
        continue-on-error: true
        uses: ./.github/actions/run-mf-tests
        with:
          make-target: "test-postgres"
          additional-pytest-options: "--overwrite-snapshots"
          hatch-environment-cache-config-json: >-
            {
              "configs": [
                {"hatch_project_directory": ".", "hatch_environment_name": "postgres-env"}
              ]
            }

      - name: Commit the changed snapshots to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests_metricflow/snapshots tests_metricflow_semantics/snapshots \
            tests_metricflow_semantic_interfaces/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changed."
          else
            git diff --cached --stat
            git commit -m "Snapshots regenerated by the overwrite-snapshots job"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Fail if either suite failed outside its snapshots
        shell: bash
        run: |
          test "${{ steps.duckdb.outcome }}" = success
          test "${{ steps.postgres.outcome }}" = success

  metricflow-unit-tests-duckdb:
    name: MetricFlow Tests (DuckDB)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check-out the repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - uses: ./.github/actions/run-mf-tests
        with:
          python-version: ${{ matrix.python-version }}
          make-target: "test-include-slow-metricflow"

  metricflow-unit-tests-postgres:
    name: MetricFlow Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: metricflow
          POSTGRES_PASSWORD: metricflowing
          POSTGRES_DB: metricflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:

      - name: Check-out the repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - uses: ./.github/actions/run-mf-tests
        with:
          make-target: "test-postgres"
          hatch-environment-cache-config-json: >-
            {
              "configs": [
                {"hatch_project_directory": ".", "hatch_environment_name": "postgres-env"}
              ]
            }

  metricflow-package-tests:
    name: MetricFlow Packages Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]
    steps:

      - name: Check-out the repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }} Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "${{ matrix.python-version }}"
          hatch-environment-cache-config-json: >-
            {
              "configs": [
                {"hatch_project_directory": ".", "hatch_environment_name": "dev-env"}
              ]
            }

      - name: Run Package-Build Tests
        shell: bash
        run: "make test-build-packages-metricflow"

  metricflow-unit-tests:
    # This step is used to simplify setup for branch protection. Branch protection is configured to check if this step
    # fails vs. checking all test steps.
    name: MetricFlow Unit Tests
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [metricflow-unit-tests-duckdb, metricflow-unit-tests-postgres]
    steps:

      - name: Check success
        run: test ${{ needs.metricflow-unit-tests-duckdb.result }} = 'success' -a ${{ needs.metricflow-unit-tests-postgres.result }} = 'success'

  dbt-metricflow-unit-tests-duckdb:
    name: dbt-MetricFlow Tests (DuckDB)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check-out the repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - uses: ./.github/actions/run-mf-tests
        with:
          python-version: ${{ matrix.python-version }}
          make-target: "test-include-slow-dbt-metricflow"

  dbt-metricflow-package-tests:
    name: dbt-MetricFlow Packages Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]
    steps:

      - name: Check-out the repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }} Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "${{ matrix.python-version }}"
          hatch-environment-cache-config-json: >-
            {
              "configs": [
                {"hatch_project_directory": ".", "hatch_environment_name": "dev-env"}
              ]
            }

      - name: Run Package-Build Tests
        shell: bash
        run: "make test-build-packages-dbt-metricflow"

  dbt-metricflow-unit-tests:
    # Aggregator for branch protection — gates dbt-metricflow checks independently of metricflow.
    name: dbt-MetricFlow Unit Tests
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [dbt-metricflow-unit-tests-duckdb]
    steps:

      - name: Check success
        run: test ${{ needs.dbt-metricflow-unit-tests-duckdb.result }} = 'success'
