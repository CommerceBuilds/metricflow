---
metric:
  name: unit_days
  description: A sum over the range, each span weighted by the days of its period it covers.
  type: simple
  type_params:
    measure: unit_days
---
metric:
  name: ending_units
  description: A balance on each period's last day. It fills, as `unit_change` needs.
  type: simple
  type_params:
    measure:
      name: on_hand_units
      fill_nulls_with: 0
  filter: "{{ Dimension('inventory_span__span_is_last') }} = 1"
---
metric:
  name: beginning_units
  description: A balance on each period's first day. It fills, as `unit_change` needs.
  type: simple
  type_params:
    measure:
      name: on_hand_units
      fill_nulls_with: 0
  filter: "{{ Dimension('inventory_span__span_is_first') }} = 1"
---
metric:
  name: received_units
  description: A plain fact's sum.
  type: simple
  type_params:
    measure: received_units
---
metric:
  name: unit_change
  description: A derived metric declaring its fill in `config.meta.fill_nulls_with`.
  type: derived
  type_params:
    expr: ending_units - beginning_units
    metrics:
      - name: ending_units
      - name: beginning_units
  config:
    meta:
      fill_nulls_with: 0
---
metric:
  name: unit_change_unfilled
  description: The same derived metric with no fill.
  type: derived
  type_params:
    expr: ending_units - beginning_units
    metrics:
      - name: ending_units
      - name: beginning_units
---
metric:
  name: unit_days_a_month_before
  description: A derived metric that reads a span metric at an offset, which a span read can't answer.
  type: derived
  type_params:
    expr: unit_days_offset
    metrics:
      - name: unit_days
        offset_window: 1 month
        alias: unit_days_offset
---
metric:
  name: unit_days_to_date
  description: A cumulative metric over a span metric, which a span read can't answer.
  type: cumulative
  type_params:
    measure: unit_days
    cumulative_type_params:
      grain_to_date: month
